<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Проверка подключения</title>
<style>body{margin:0;background:#151b25;color:#edf4fa;font:16px/1.5 system-ui,sans-serif;padding:22px;box-sizing:border-box}main{max-width:500px;margin:auto}h1{font-size:25px}section{padding:16px;background:#233144;border-radius:16px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:15px;margin:12px 0}.row strong{text-align:right}button{display:block;width:100%;padding:16px;border:0;border-radius:14px;font:700 16px system-ui;margin:12px 0;background:#6ad3df;color:#13232d}button.secondary{background:#30445c;color:#edf4fa}button:disabled{opacity:.45}small{display:block;color:#b4c3d2}.ok{color:#9de5ac}.bad{color:#ffbd91}</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main><h1 id="title">Проверка подключения</h1><p id="intro">Проверим связь с сервером игры и вход через Telegram. Прогресс не сбрасывается.</p><section aria-live="polite"><div class="row"><span id="healthLabel">Связь с сервером</span><strong id="health">Проверяем…</strong></div><div class="row"><span id="authLabel">Вход в профиль</span><strong id="auth">Проверяем…</strong></div><div class="row"><span id="backupLabel">Резервный вход</span><strong id="backup">Проверяем…</strong></div></section><button id="send" disabled>Передать результат боту</button><button id="retry" class="secondary">Проверить ещё раз</button><button id="play" class="secondary">Открыть игру заново</button><small id="privacy">Передаются только коды результата проверки. Пароли, ключи и данные входа в отчёт не попадают.</small><p id="hint"></p></main><script src="config.js?v=5.05"></script><script src="connection-check.js?v=5.05"></script></body></html>
