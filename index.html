<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Симулятор бомжа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.6">
</head>
<body>
  <!-- Общие паттерны для всех SVG (полоски тельняшки, кирпичи и т.д.) -->
  <svg id="globalDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <div id="app">
    <header class="topbar">
      <button class="profile-btn" id="profileBtn">
        <div class="avatar" id="avatar">В</div>
        <div class="pinfo">
          <div class="pname" id="pname">Валера</div>
          <div class="plevel" id="plevel">Ур. 1</div>
          <div class="xpbar"><div id="xpFill"></div></div>
        </div>
      </button>
      <div class="res-row">
        <div class="res" id="resMoney"><i class="ic" data-ic="coin"></i><span id="money">0</span></div>
        <div class="res" id="resBottles"><i class="ic" data-ic="bottle"></i><span id="bottles">0</span></div>
        <button class="res caps" id="resCaps"><i class="ic" data-ic="cap"></i><span id="caps">0</span><b>+</b></button>
        <button class="gear" id="settingsBtn" data-act="settings" aria-label="Настройки">⚙️</button>
      </div>
    </header>

    <main>
      <section class="screen active" id="screen-game">
        <div class="scene" id="scene">
          <div class="scene-bg" id="sceneBg"></div>
          <div class="season-fx" id="seasonFx"></div>
          <div class="weather-fx" id="weatherFx"></div>
          <div class="pet-slot" id="petSlot"></div>
          <div class="quest-pin hidden" id="questPin" data-act="openQuest"></div>
          <div class="inv-pin hidden" id="invPin" data-act="openMarket"></div>
          <div class="scene-info">
            <div class="loc-name" id="locName"></div>
            <div class="passive" id="passive"></div>
          </div>
          <div class="scene-right">
            <div class="boost-badge hidden" id="boostBadge"></div>
            <div class="effects" id="effects"></div>
          </div>
          <div class="valera-wrap" id="valera"></div>
          <div class="activity hidden" id="activity"></div>
          <div class="fx-layer" id="fx"></div>
          <button class="weather-chip" id="weatherChip" data-act="weatherInfo"></button>
          <button class="chat-btn hidden" id="chatBtn" data-act="openChat">💬<i class="dot hidden" id="chatBadge"></i></button>
          <div class="tap-hint" id="tapHint">Тапай по Валере!</div>
        </div>
        <div class="bars">
          <div class="bar"><i class="ic" data-ic="energy"></i><div class="track"><div class="fill energy" id="energyFill"></div></div><span id="energyText"></span></div>
          <div class="bar"><i class="ic" data-ic="food"></i><div class="track"><div class="fill food" id="foodFill"></div></div><span id="foodText"></span></div>
          <div class="bar"><i class="ic" data-ic="heart"></i><div class="track"><div class="fill health" id="healthFill"></div></div><span id="healthText"></span></div>
          <div class="bar"><i class="ic" data-ic="smile"></i><div class="track"><div class="fill mood" id="moodFill"></div></div><span id="moodText"></span></div>
        </div>
        <div class="actions">
          <button class="btn act primary" id="exchangeBtn"><span class="act-emoji">💱</span><div><b>Обменник</b><small id="exchangeInfo"></small></div></button>
          <button class="btn act" id="trashBtn"><span class="act-emoji">🗑️</span><div><b>Мусорка</b><small id="trashInfo">готово</small></div></button>
          <button class="btn act" id="eatBtn"><span class="act-emoji">🍞</span><div><b>Поесть</b><small id="eatInfo">магазин</small></div></button>
          <button class="btn act" id="sleepBtn"><span class="act-emoji">💤</span><div><b>Спать</b><small id="sleepInfo"></small></div></button>
        </div>
      </section>

      <section class="screen" id="screen-shop">
        <div class="seg tiles" data-group="shop">
          <button data-tab="housing"><i>🏠</i><span>Жильё</span></button>
          <button data-tab="clothes"><i>👕</i><span>Одежда</span></button>
          <button data-tab="food"><i>🍞</i><span>Еда</span></button>
          <button data-tab="transport"><i>🛴</i><span>Транспорт</span></button>
          <button data-tab="pets"><i>🐕</i><span>Питомцы</span></button>
          <button data-tab="season" class="season-tab hidden" id="seasonTab"><i>🎃</i><span>Ивент</span></button>
          <button data-tab="premium"><i>⭐</i><span>Донат</span></button>
        </div>
        <div class="list" id="shopList"></div>
      </section>

      <section class="screen" id="screen-life">
        <div class="seg tiles" data-group="life">
          <button data-tab="work"><i>💼</i><span>Работа</span></button>
          <button data-tab="business"><i>🏪</i><span>Бизнес</span></button>
          <button data-tab="study"><i>🎓</i><span>Учёба</span></button>
          <button data-tab="health"><i>🏥</i><span>Врачи</span></button>
          <button data-tab="gym"><i>💪</i><span>Спорт</span></button>
          <button data-tab="skills"><i>✨</i><span>Навыки</span></button>
        </div>
        <div class="list" id="lifeList"></div>
      </section>

      <section class="screen" id="screen-fun">
        <div class="seg tiles" data-group="fun">
          <button data-tab="casino"><i>🎰</i><span>Казино</span></button>
          <button data-tab="fights"><i>👊</i><span>Драки</span></button>
          <button data-tab="market"><i>🦊</i><span>Рынок</span></button>
          <button data-tab="dates"><i>💘</i><span>Свидания</span></button>
          <button data-tab="rest"><i>🍻</i><span>Отдых</span></button>
          <button data-tab="lotto"><i>🎟️</i><span>Лото</span></button>
          <button data-tab="clan"><i>🏴</i><span>Банда</span></button>
          <button data-tab="crime" class="hidden" id="crimeTab"><i>🕶️</i><span>Криминал</span></button>
        </div>
        <div class="list" id="funList"></div>
      </section>

      <section class="screen" id="screen-tasks">
        <div class="seg tiles" data-group="tasks">
          <button data-tab="story"><i>📖</i><span>Сюжет</span></button>
          <button data-tab="tasks"><i>📋</i><span>Задания</span></button>
          <button data-tab="ach"><i>🏅</i><span>Достижения</span></button>
          <button data-tab="coll"><i>🧩</i><span>Коллекции</span></button>
          <button data-tab="prestige"><i>⭐</i><span>Престиж</span></button>
          <button data-tab="top"><i>🏆</i><span>Топ</span></button>
        </div>
        <div class="list" id="tasksList"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button data-screen="game" class="on"><span>🍾</span>Игра</button>
      <button data-screen="shop"><span>🛒</span>Магазин</button>
      <button data-screen="life"><span>🧑‍💼</span>Жизнь<i class="dot hidden" id="lifeDot"></i></button>
      <button data-screen="fun"><span>🎰</span>Досуг</button>
      <button data-screen="tasks"><span>📋</span>Задания<i class="dot hidden" id="tasksDot"></i></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <!-- ?v= — номер версии. Меняй его при каждом обновлении, иначе Telegram покажет старые файлы из кэша -->
  <script src="audio.js?v=1.6"></script>
  <script src="art.js?v=1.6"></script>
  <script src="game.js?v=1.6"></script>
  <script src="systems.js?v=1.6"></script>
  <script src="minigames.js?v=1.6"></script>
  <script src="fights.js?v=1.6"></script>
  <script src="casino.js?v=1.6"></script>
  <script src="quests.js?v=1.6"></script>
  <script src="life.js?v=1.6"></script>
  <script src="family.js?v=1.6"></script>
  <script src="careers.js?v=1.6"></script>
  <script src="cutscenes.js?v=1.6"></script>
  <script src="extras.js?v=1.6"></script>
  <script src="config.js?v=1.6"></script>
  <script src="referral.js?v=1.6"></script>
  <script src="online.js?v=1.6"></script>
  <script src="gym.js?v=1.6"></script>
  <script src="ux.js?v=1.6"></script>
  <script src="lotto.js?v=1.6"></script>
  <script src="changelog.js?v=1.6"></script>
  <script src="social.js?v=1.6"></script>
  <script src="arena.js?v=1.6"></script>
  <script src="life2.js?v=1.6"></script>
  <script src="crime.js?v=1.6"></script>
  <script src="world.js?v=1.6"></script>
  <script src="progress.js?v=1.6"></script>
  <script src="tips.js?v=1.6"></script>
  <script src="boot.js?v=1.6"></script>
</body>
</html>
